[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reccli"
version = "0.9.0"
description = "Temporal memory engine for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Will Luecke" }
]

[project.scripts]
reccli = "reccli.cli_bootstrap:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["packages"]
include = ["reccli*"]

[tool.setuptools.package-data]
reccli = [
  "organization-web/*.json",
  "organization-web/*.ts",
  "organization-web/*.d.ts",
  "organization-web/src/**/*.css",
  "organization-web/src/**/*.ts",
  "organization-web/src/**/*.tsx",
]
